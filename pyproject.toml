[project]
name = "app"
version = "0.1.0"
description = "Tenant maintenance triage agent for Harbour Lettings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langsmith>=0.14.11",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sqlite-vec>=0.1.9",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: calls a real LLM; skipped without OPENAI_API_KEY and AGENT_MODEL"]
